name: cabbage3-build

on:
  push:
    branches:
      - main
      - develop

jobs:
  macos_build:
    name: MacOS build
    runs-on: macos-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v1
        with:
          fetch-depth: 1
          submodules: true

      - name: Download CsoundLib64 Package
        run: |
          # Download the package using curl
          curl -L -o csound-7.zip "https://www.dropbox.com/scl/fi/d5hnkcecizlwgvnaw1yjy/csound-7.zip?rlkey=pf9v3ucfo8hecyl5ahbacr0a0&dl=1"
          
          # Extract the zip file
          unzip csound-7.zip -d csound-7

          # Verify the file exists
          ls -l csound-7/CsoundLib64-7.0-vanilla-universal.pkg

          # Make the downloaded file executable
          chmod +x csound-7/CsoundLib64-7.0-vanilla-universal.pkg

          # Install the package
          sudo installer -pkg csound-7/CsoundLib64-7.0-vanilla-universal.pkg -target /


      - name: Set up Xcode path
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Configure CMake (tests only)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: cmake --build build --target CabbageTests # Replace with your test target name
  
      - name: Run unit tests
        run: ./build/Debug/CabbageTests --reporter compact # Adjust path/target as needed

        
      - name: Configure and build
        run: |
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          # Get absolute paths to compilers
          CC_PATH=$(which clang)
      - name: Configure and build
        run: |
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          # Get absolute paths to compilers
          CC_PATH=$(which clang)
          CXX_PATH=$(which clang++)

          cmake -GXcode -B build \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0" \
          -DCMAKE_C_COMPILER=$CC_PATH \
          -DCMAKE_CXX_COMPILER=$CXX_PATH \
          -DCMAKE_OBJC_COMPILER=$CC_PATH \
          -DCMAKE_OBJCXX_COMPILER=$CXX_PATH \
          -DBUILD_ALL_TARGETS=True \
          -DCMAKE_BUILD_TYPE=Release

      - name: Zip the macOS app bundle
        run: |
          cd build
          zip -r CabbageBundle.zip \
            CabbagePluginSynth/CabbagePluginSynth_assets/Release/CabbagePluginSynth.vst3 \
            CabbagePluginEffect/CabbagePluginEffect_assets/Release/CabbagePluginEffect.vst3 \
            CabbageApp/Release/CabbageApp


      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with: 
          name: CabbageBundle-macos
          path: build/CabbageBundle.zip

  windows_build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v1
        with:
          fetch-depth: 1
          submodules: true

      - name: Download and Extract Csound
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.dropbox.com/scl/fi/41g11e00yb4v66fduyw3f/Csound7.zip?rlkey=231ot83u6rmnxapwe03krm04z&st=5bzhtada&dl=1" -OutFile "Csound7.zip"
          Expand-Archive -Path "Csound7.zip" -DestinationPath "$env:ProgramFiles"
          Get-ChildItem "$env:ProgramFiles\Csound7"

      - name: Configure build
        shell: cmd
        run: |
          cmake -G "Visual Studio 17 2022" -S . -B build -DBUILD_ALL_TARGETS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Zip the Windows app artifacts
        shell: pwsh
        run: |
          cd build
          Compress-Archive -Path @(
            "CabbagePluginEffect/CabbagePluginEffect_assets/VST3/Release/CabbagePluginEffect.vst3",
            "CabbagePluginSynth/CabbagePluginSynth_assets/VST3/Release/CabbagePluginSynth.vst3",
            "CabbageApp/Release/CabbageApp.exe"
          ) -DestinationPath CabbageBundle.zip

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: CabbageBundle-windows
          path: build\CabbageBundle.zip


